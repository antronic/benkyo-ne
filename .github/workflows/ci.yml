name: CI

on:
  pull_request:
  push:
    branches: [claude/japanese-learning-pwa-hrznwf]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check, lint, test, build, layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint:ui
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:layout
        env:
          LAYOUT_SHOTS: layout-failures
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-failures
          path: layout-failures
          if-no-files-found: ignore
