name: CI

on:
  pull_request:
  push:
    branches: [claude/japanese-learning-pwa-hrznwf]

permissions:
  contents: read
  # @antronic/coreva-render comes from GitHub Packages (.npmrc, docs/AVATAR.md)
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check, lint, test, build, layout, render, storybook
    # Runs on Job's self-hosted runner (docs/CI-RUNNER.md). To go back to a
    # GitHub-hosted machine without a code change, set the repository variable
    # CI_RUNNER to ubuntu-latest (Settings → Secrets and variables → Actions).
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # The repo is public: never run a fork's code on the self-hosted machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      # Node 22 is fetched once into the runner's tool cache. No `cache: npm`:
      # ~/.npm already persists on a self-hosted machine, so `npm ci` stays warm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository secret PACKAGES_TOKEN (read:packages; GitHub forbids GITHUB_ names) installs the avatar engine.
      # Without it, GITHUB_TOKEN works once the package grants this repository Actions access.
      - run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run check
      - run: npm run lint:ui
      - run: npm test
      - run: npm run build
      # Downloads Chromium into ~/.cache/ms-playwright only when this Playwright
      # version's build is missing. System libraries are installed once when the
      # runner is set up; GitHub-hosted machines get them here (passwordless sudo).
      - name: Install Chromium for Playwright
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run check:layout
        env:
          LAYOUT_SHOTS: layout-failures
          LAYOUT_REVIEW: layout-review
      - run: npm run check:render
      # every Storybook story (built into build/storybook/ by npm run build) renders in light and dark
      - run: npm run check:storybook
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-failures
          path: layout-failures
          if-no-files-found: ignore
      # every avatar setup step at 390/768/1024/1280 px, for the visual review in the PR
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-review
          path: layout-review
          if-no-files-found: ignore
